  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">Ramdani Law Firm</a>
      <nav class="nav" aria-label="Primary"><a href="/" data-i18n="nav_home"></a>
        <a href="/pages/about.html" data-i18n="nav_about"></a>
        <a href="/pages/people.html" data-i18n="nav_people"></a>

      <div class="lang-switch">
        <button type="button" data-lang-btn="en" data-i18n="lang_en">EN</button>
        <button type="button" data-lang-btn="ur" data-i18n="lang_ur">اردو</button>
        <button type="button" class="theme-btn" id="themeBtn" aria-label="Theme">Theme</button>
      </div>
    </div>
  </header>
  <main id="main-content">
    <section class="section"><div class="wrap">
      <h1 data-i18n="library_title"></h1>
      <p class="lead" data-i18n="library_lead"></p>
      <p class="note">Staff-published listings only. Copyrighted books are not hosted as PDFs. Paid titles are inquiry-only — this website does not process JazzCash, EasyPaisa, Stripe, or card payments.</p>
      <div class="library-filters" id="libraryFilters">
        <label class="sr-only" for="librarySearch">Search titles</label>
        <input type="search" id="librarySearch" placeholder="Search title or author" />
        <label class="sr-only" for="libraryAccess">Access</label>
        <select id="libraryAccess">
          <option value="">All listings</option>
          <option value="free">Free listings</option>
          <option value="paid">Paid — inquiry only</option>
        </select>
      </div>
      <div id="list" class="library-grid"></div>
      <div class="pagination" id="libraryPager"></div>
    </div></section>
    <dialog class="inquiry-dialog" id="bookInquiry">
      <form class="form" id="bookInquiryForm">
        <h2 id="bookInquiryTitle">Title inquiry</h2>
        <p class="note" id="bookInquiryHint"></p>
        <input type="hidden" name="kind" value="purchase_inquiry" />
        <input type="text" name="company_website" class="hidden" tabindex="-1" autocomplete="off" />
        <label>Full name<input name="full_name" required /></label>
        <label>Email<input name="email" type="email" required /></label>
        <label>Message (optional, no privileged documents)<textarea name="message" rows="4"></textarea></label>
        <div class="hero-actions">
          <button class="btn btn-primary" type="submit">Send inquiry</button>
          <button class="btn" type="button" id="bookInquiryCancel">Cancel</button>
        </div>
        <p class="form-status"></p>
      </form>
    </dialog>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n="footer_note"></p>
      <p>Dera Ghazi Khan, Pakistan</p>
      <div class="social-slots" aria-label="Social profiles">
      </div>
    </div>
  </footer>

document.addEventListener('DOMContentLoaded', function () {
  if (window.ramdaniEducation) ramdaniEducation.renderLibrary();
});
</script>
