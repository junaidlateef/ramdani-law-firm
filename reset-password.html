<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Ramdani Law Firm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <link rel="stylesheet" href="/css/rtl.css" />
  <link rel="icon" type="image/png" href="/assets/ramdani-logo.png" />
  <meta name="description" content="Staff password reset for Ramdani Law Firm." />
  <link rel="canonical" href="https://ramdani-law-firm.vercel.app/reset-password" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <div class="auth-box">
    <h1>Set a new password</h1>
    <p class="note">Staff accounts only. After the password is updated, sign in on the staff page.</p>
    <p id="resetWaiting" class="note">Checking the reset link…</p>
    <form class="form" id="resetForm" hidden>
      <label>New password <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" /></label>
      <label>Confirm password <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" /></label>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
    <p id="resetStatus" class="form-status"></p>
    <p><a href="/admin/">Staff sign in</a></p>
  </div>
  <script>
    window.__RAMDANI_RECOVERY_HREF = location.href;
    window.__RAMDANI_RECOVERY_SEARCH = location.search || '';
    window.__RAMDANI_RECOVERY_HASH = location.hash || '';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js?v=20260918c"></script>
  <script src="/js/supabase-client.js?v=20260918c"></script>
  <script src="/js/auth.js?v=20260918c"></script>
  <script src="/js/reset-password.js?v=20260918c"></script>
</body>
</html>
