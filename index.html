<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ramdani Law Firm — Admin Panel</title>
<style>
:root{
  --admin-primary:#0B1F33;--admin-accent:#B8892B;--admin-bg:#F5F6F8;--admin-surface:#FFFFFF;
  --admin-text:#111827;--admin-text-muted:#6B7280;--admin-border:#E5E7EB;
  --admin-success:#15803D;--admin-warning:#B45309;--admin-error:#B91C1C;--sidebar-w:260px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--admin-bg);color:var(--admin-text);}
a{color:inherit;text-decoration:none;}
.admin-shell{display:flex;min-height:100vh;}
.admin-sidebar{width:var(--sidebar-w);background:var(--admin-primary);color:#fff;flex-shrink:0;padding:20px 0;overflow-y:auto;}
.admin-sidebar .brand{padding:0 20px 20px;font-weight:700;font-size:16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px;}
.admin-sidebar .brand small{display:block;font-weight:400;opacity:.7;font-size:12px;margin-top:2px;}
.nav-group-title{padding:10px 20px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;}
.nav-link{display:block;padding:8px 20px;font-size:14px;opacity:.85;border-left:3px solid transparent;cursor:pointer;}
.nav-link:hover{background:rgba(255,255,255,.06);opacity:1;}
.nav-link.active{background:rgba(255,255,255,.1);opacity:1;border-left-color:var(--admin-accent);font-weight:600;}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.admin-topbar{height:56px;background:var(--admin-surface);border-bottom:1px solid var(--admin-border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.admin-topbar .page-title{font-weight:600;font-size:15px;}
.admin-topbar .actions{display:flex;gap:10px;align-items:center;}
.admin-content{padding:24px;flex:1;}
.card{background:var(--admin-surface);border:1px solid var(--admin-border);border-radius:10px;padding:20px;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--admin-border);background:var(--admin-surface);font-size:13px;cursor:pointer;}
.btn-primary{background:var(--admin-primary);color:#fff;border-color:var(--admin-primary);}
.btn-danger{background:var(--admin-error);color:#fff;border-color:var(--admin-error);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--admin-border);}
th{color:var(--admin-text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
tr:hover td{background:#FAFAFA;}
.status-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.status-published{background:#DCFCE7;color:var(--admin-success);}
.status-draft{background:#FEF3C7;color:var(--admin-warning);}
.status-archived{background:#F3F4F6;color:var(--admin-text-muted);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-field{margin-bottom:14px;}
.form-field.full{grid-column:1/-1;}
.form-field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--admin-text-muted);}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:8px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:14px;font-family:inherit;}
.form-field textarea{min-height:90px;resize:vertical;}
.empty-state{text-align:center;padding:48px 20px;color:var(--admin-text-muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--admin-primary);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:100;}
.toast.error{background:var(--admin-error);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:10px;padding:24px;width:100%;max-width:720px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--admin-primary);}
.login-card{background:#fff;border-radius:10px;padding:32px;width:100%;max-width:360px;}
.login-card h1{font-size:18px;margin:0 0 4px;}
.login-card p{color:var(--admin-text-muted);font-size:13px;margin:0 0 20px;}
#login-error{color:var(--admin-error);font-size:13px;margin-top:10px;display:none;}
</style>
</head>
<body>

<!-- ========================= LOGIN VIEW ========================= -->
<div id="view-login" class="login-wrap" style="display:none;">
  <div class="login-card">
    <h1>Ramdani Law Firm</h1>
    <p>Admin Panel Sign In</p>
    <form id="login-form">
      <div class="form-field"><label>Email</label><input type="email" name="email" required /></div>
      <div class="form-field"><label>Password</label><input type="password" name="password" required /></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<!-- ========================= APP SHELL ========================= -->
<div id="view-app" class="admin-shell" style="display:none;">
  <nav class="admin-sidebar" id="sidebar-root"></nav>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="actions">
        <button class="btn btn-primary" id="add-btn" style="display:none;">+ Add</button>
        <button class="btn" id="signout-btn">Sign Out</button>
      </div>
    </div>
    <div class="admin-content" id="page-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================================
// SUPABASE CONFIG — fill these in
// ============================================================================
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentStaffProfile = null;

// ============================================================================
// NAVIGATION — mirrors spec section 36 dashboard structure
// ============================================================================
const ADMIN_NAV = [
  { group: null, items: [ { label: "Dashboard", route: "dashboard" } ] },
  { group: "Content", items: [
    { label: "Practice Areas", route: "practice-areas" }
    // Add more routes here following the same crud config pattern below —
    // e.g. People, Services, Matters, Articles, News, Resources.
  ]},
  { group: "Branding", items: [
    { label: "Organization", route: "org-settings" }
    // Add: Logo & Colors, Typography, Certificate Branding, Contact & Social
  ]}
  // Education / Community / Communications / Website / System groups:
  // add routes here the same way once you tell me which module to do next.
];

const CRUD_CONFIGS = {
  "practice-areas": {
    table: "practice_areas",
    title: "Practice Areas",
    orderBy: { column: "sort_order", ascending: true },
    listColumns: [
      { key: "title", label: "Title" },
      { key: "status", label: "Status", pill: true },
      { key: "sort_order", label: "Order" }
    ],
    fields: [
      { key: "title", label: "Title", type: "text", required: true },
      { key: "slug", label: "Slug", type: "text" },
      { key: "sort_order", label: "Display Order", type: "number" },
      { key: "status", label: "Status", type: "select", options: ["draft","published","archived"] },
      { key: "summary", label: "Summary", type: "textarea", full: true },
      { key: "overview", label: "Overview", type: "textarea", full: true },
      { key: "approach", label: "Approach", type: "textarea", full: true },
      { key: "body", label: "Full Body", type: "textarea", full: true }
      // services/sub_areas/relevant_laws/process/faqs are jsonb — needs a
      // repeating-field editor before exposing here, left out to avoid
      // corrupting structured data via a plain textarea.
    ]
  }
};

const SETTINGS_CONFIGS = {
  "org-settings": {
    table: "organization_settings",
    title: "Organization Settings",
    fields: [
      { key: "org_name", label: "Organization Name", type: "text" },
      { key: "legal_name", label: "Legal / Business Name", type: "text" },
      { key: "short_name", label: "Short Name", type: "text" },
      { key: "established_year", label: "Established Year", type: "number" },
      { key: "org_type", label: "Organization Type", type: "text" },
      { key: "tagline", label: "Tagline", type: "text", full: true },
      { key: "description", label: "Description", type: "textarea", full: true },
      { key: "about_text", label: "About Text", type: "textarea", full: true },
      { key: "mission", label: "Mission", type: "textarea", full: true },
      { key: "vision", label: "Vision", type: "textarea", full: true }
    ]
  }
};

// ============================================================================
// AUTH
// ============================================================================
async function checkSessionAndRoute() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { showLogin(); return; }

  const { data: staffProfile, error } = await supabase
    .from("staff_profiles").select("id, role").eq("id", session.user.id).maybeSingle();

  if (error || !staffProfile) {
    await supabase.auth.signOut();
    showLogin("That account does not have staff access.");
    return;
  }
  currentStaffProfile = staffProfile;
  showApp();
  renderSidebar();
  handleRoute();
}

function showLogin(errorMsg) {
  document.getElementById("view-login").style.display = "flex";
  document.getElementById("view-app").style.display = "none";
  const el = document.getElementById("login-error");
  if (errorMsg) { el.textContent = errorMsg; el.style.display = "block"; }
}

function showApp() {
  document.getElementById("view-login").style.display = "none";
  document.getElementById("view-app").style.display = "flex";
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const { error } = await supabase.auth.signInWithPassword({
    email: fd.get("email"), password: fd.get("password")
  });
  const errEl = document.getElementById("login-error");
  if (error) { errEl.textContent = error.message; errEl.style.display = "block"; return; }
  checkSessionAndRoute();
});

document.getElementById("signout-btn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  currentStaffProfile = null;
  showLogin();
});

// ============================================================================
// ROUTER (hash-based, single file)
// ============================================================================
window.addEventListener("hashchange", handleRoute);

function currentRoute() {
  return (window.location.hash || "#dashboard").replace("#", "");
}

function handleRoute() {
  if (!currentStaffProfile) return;
  const route = currentRoute();
  renderSidebar();
  document.getElementById("add-btn").style.display = "none";

  if (route === "dashboard") { renderDashboard(); return; }
  if (CRUD_CONFIGS[route]) { renderCrudPage(CRUD_CONFIGS[route]); return; }
  if (SETTINGS_CONFIGS[route]) { renderSettingsPage(SETTINGS_CONFIGS[route]); return; }

  document.getElementById("page-title").textContent = "Not Found";
  document.getElementById("page-content").innerHTML = `<div class="empty-state">Page not built yet. Tell me which module and I'll add it.</div>`;
}

function renderSidebar() {
  const root = document.getElementById("sidebar-root");
  const route = currentRoute();
  let html = `<div class="brand">Ramdani Law Firm<small>Admin Panel</small></div>`;
  ADMIN_NAV.forEach(section => {
    if (section.group) html += `<div class="nav-group-title">${section.group}</div>`;
    section.items.forEach(item => {
      const active = item.route === route ? "active" : "";
      html += `<a class="nav-link ${active}" href="#${item.route}">${item.label}</a>`;
    });
  });
  root.innerHTML = html;
}

// ============================================================================
// HELPERS
// ============================================================================
function toast(message, isError) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function statusPillHtml(status) {
  const cls = status === "published" ? "status-published" : status === "archived" ? "status-archived" : "status-draft";
  return `<span class="status-pill ${cls}">${status || "draft"}</span>`;
}
function escapeHtmlStr(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function escapeHtml(val) {
  if (val === null || val === undefined) return "—";
  if (typeof val === "object") return escapeHtmlStr(JSON.stringify(val));
  return escapeHtmlStr(String(val));
}
async function logAuditEvent(action, entity, entityId) {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;
  await supabase.from("audit_events").insert({ actor_id: session.user.id, action, entity, entity_id: entityId || null });
}

// ============================================================================
// DASHBOARD
// ============================================================================
async function renderDashboard() {
  document.getElementById("page-title").textContent = "Dashboard";
  document.getElementById("page-content").innerHTML = `
    <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px;"></div>
    <div class="card"><h3 style="margin-top:0;">Recent Inquiries</h3>
      <table><thead><tr><th>Name</th><th>Kind</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="recent-inquiries"><tr><td colspan="4">Loading…</td></tr></tbody></table></div>
    <div class="card"><h3 style="margin-top:0;">Recent Admin Activity</h3>
      <table><thead><tr><th>Action</th><th>Entity</th><th>When</th></tr></thead>
      <tbody id="recent-audit"><tr><td colspan="3">Loading…</td></tr></tbody></table></div>
  `;

  const counters = [
    { table: "inquiries", label: "Open Inquiries", filter: q => q.eq("status", "new") },
    { table: "profiles", label: "Active Students", filter: q => q.eq("role", "student").eq("is_active", true) },
    { table: "internship_applications", label: "Pending Applications", filter: q => q.eq("status", "pending") },
    { table: "articles", label: "Published Articles", filter: q => q.eq("status", "published") },
    { table: "practice_areas", label: "Practice Areas", filter: q => q.eq("status", "published") },
    { table: "societies", label: "Societies", filter: q => q.eq("status", "published") }
  ];
  const grid = document.getElementById("stats-grid");
  grid.innerHTML = counters.map(c => `
    <div class="card" style="margin-bottom:0;">
      <div style="font-size:24px;font-weight:700;" id="stat-${c.table}">—</div>
      <div style="font-size:12px;color:var(--admin-text-muted);">${c.label}</div>
    </div>`).join("");

  for (const c of counters) {
    let q = supabase.from(c.table).select("*", { count: "exact", head: true });
    q = c.filter(q);
    const { count } = await q;
    const el = document.getElementById(`stat-${c.table}`);
    if (el) el.textContent = count ?? "0";
  }

  const { data: inquiries } = await supabase.from("inquiries")
    .select("full_name, kind, status, created_at").order("created_at", { ascending: false }).limit(6);
  document.getElementById("recent-inquiries").innerHTML = (inquiries || []).map(i => `
    <tr><td>${i.full_name || "—"}</td><td>${i.kind || "—"}</td><td>${i.status || "—"}</td>
    <td>${new Date(i.created_at).toLocaleDateString()}</td></tr>`).join("") || `<tr><td colspan="4">No inquiries yet.</td></tr>`;

  const { data: audit } = await supabase.from("audit_events")
    .select("action, entity, created_at").order("created_at", { ascending: false }).limit(8);
  document.getElementById("recent-audit").innerHTML = (audit || []).map(a => `
    <tr><td>${a.action}</td><td>${a.entity}</td>
    <td>${new Date(a.created_at).toLocaleString()}</td></tr>`).join("") || `<tr><td colspan="3">No activity yet.</td></tr>`;
}

// ============================================================================
// GENERIC LIST-CRUD PAGE
// ============================================================================
async function renderCrudPage(config) {
  document.getElementById("page-title").textContent = config.title;
  document.getElementById("page-content").innerHTML = `
    <div class="card">
      <table>
        <thead><tr>${config.listColumns.map(c => `<th>${c.label}</th>`).join("")}<th>Actions</th></tr></thead>
        <tbody id="crud-tbody"><tr><td colspan="${config.listColumns.length+1}">Loading…</td></tr></tbody>
      </table>
    </div>`;

  const addBtn = document.getElementById("add-btn");
  addBtn.style.display = "inline-flex";
  addBtn.onclick = () => openCrudModal(config, null);

  await loadCrudRows(config);
}

let crudRowsCache = [];

async function loadCrudRows(config) {
  let query = supabase.from(config.table).select("*");
  query = config.orderBy ? query.order(config.orderBy.column, { ascending: config.orderBy.ascending })
                          : query.order("created_at", { ascending: false });
  const { data, error } = await query;
  if (error) { toast("Load failed: " + error.message, true); return; }
  crudRowsCache = data || [];
  renderCrudTable(config);
}

function renderCrudTable(config) {
  const tbody = document.getElementById("crud-tbody");
  if (!tbody) return;
  if (!crudRowsCache.length) {
    tbody.innerHTML = `<tr><td colspan="${config.listColumns.length+1}"><div class="empty-state">No records yet. Click "Add" to create one.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = crudRowsCache.map(row => `
    <tr>
      ${config.listColumns.map(col => `<td>${col.pill ? statusPillHtml(row[col.key]) : escapeHtml(row[col.key])}</td>`).join("")}
      <td>
        <button class="btn" onclick="window.__crudEdit('${row.id}')">Edit</button>
        <button class="btn btn-danger" onclick="window.__crudDelete('${row.id}')">Delete</button>
      </td>
    </tr>`).join("");

  window.__crudEdit = (id) => openCrudModal(config, crudRowsCache.find(r => r.id === id));
  window.__crudDelete = async (id) => {
    if (!confirm("Delete this record? This cannot be undone.")) return;
    const { error } = await supabase.from(config.table).delete().eq("id", id);
    if (error) { toast("Delete failed: " + error.message, true); return; }
    await logAuditEvent(`deleted ${config.table}`, config.table, id);
    toast("Deleted.");
    loadCrudRows(config);
  };
}

function renderFieldHtml(f, row) {
  const val = row ? (row[f.key] ?? "") : (f.default ?? "");
  const fullClass = f.full ? " full" : "";
  if (f.type === "textarea") return `<div class="form-field${fullClass}"><label>${f.label}</label><textarea name="${f.key}" ${f.required?"required":""}>${escapeHtmlStr(val)}</textarea></div>`;
  if (f.type === "select") return `<div class="form-field${fullClass}"><label>${f.label}</label><select name="${f.key}">${f.options.map(o=>`<option value="${o}" ${o===val?"selected":""}>${o}</option>`).join("")}</select></div>`;
  if (f.type === "number") return `<div class="form-field${fullClass}"><label>${f.label}</label><input type="number" name="${f.key}" value="${escapeHtmlStr(val)}" ${f.required?"required":""} /></div>`;
  if (f.type === "checkbox") return `<div class="form-field${fullClass}"><label><input type="checkbox" name="${f.key}" ${val?"checked":""} style="width:auto;display:inline-block;margin-right:6px;" />${f.label}</label></div>`;
  return `<div class="form-field${fullClass}"><label>${f.label}</label><input type="${f.type||'text'}" name="${f.key}" value="${escapeHtmlStr(val)}" ${f.required?"required":""} /></div>`;
}

function openCrudModal(config, row) {
  const html = `
    <div class="modal-backdrop" id="crud-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>${row ? "Edit" : "Add"} ${config.title}</h3>
          <button class="btn" id="crud-modal-close">Close</button>
        </div>
        <form id="crud-form">
          <div class="form-grid">${config.fields.map(f => renderFieldHtml(f, row)).join("")}</div>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
            <button type="button" class="btn" id="crud-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>`;
  document.body.insertAdjacentHTML("beforeend", html);
  const closeModal = () => document.getElementById("crud-modal")?.remove();
  document.getElementById("crud-modal-close").onclick = closeModal;
  document.getElementById("crud-modal-cancel").onclick = closeModal;

  document.getElementById("crud-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {};
    config.fields.forEach(f => {
      if (f.type === "checkbox") payload[f.key] = fd.get(f.key) === "on";
      else if (f.type === "number") { const v = fd.get(f.key); payload[f.key] = v === "" ? null : Number(v); }
      else payload[f.key] = fd.get(f.key) || null;
    });

    let error, entityId;
    if (row) {
      const res = await supabase.from(config.table).update(payload).eq("id", row.id);
      error = res.error; entityId = row.id;
      if (!error) await logAuditEvent(`updated ${config.table}`, config.table, entityId);
    } else {
      const res = await supabase.from(config.table).insert(payload).select().single();
      error = res.error; entityId = res.data?.id;
      if (!error) await logAuditEvent(`created ${config.table}`, config.table, entityId);
    }
    if (error) { toast("Save failed: " + error.message, true); return; }
    toast("Saved.");
    closeModal();
    loadCrudRows(config);
  });
}

// ============================================================================
// GENERIC SINGLETON SETTINGS PAGE
// ============================================================================
async function renderSettingsPage(config) {
  document.getElementById("page-title").textContent = config.title;
  document.getElementById("page-content").innerHTML = `
    <div class="card">
      <form id="settings-form">
        <div class="form-grid">${config.fields.map(f => renderFieldHtml(f, null)).join("")}</div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>`;

  const { data, error } = await supabase.from(config.table).select("*").limit(1).maybeSingle();
  if (error) { toast("Load failed: " + error.message, true); return; }

  const form = document.getElementById("settings-form");
  let currentRowId = data ? data.id : null;
  if (data) {
    config.fields.forEach(f => { if (form.elements[f.key]) form.elements[f.key].value = data[f.key] ?? ""; });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {};
    config.fields.forEach(f => {
      if (f.type === "number") { const v = fd.get(f.key); payload[f.key] = v === "" ? null : Number(v); }
      else payload[f.key] = fd.get(f.key) || null;
    });

    let error;
    if (currentRowId) {
      ({ error } = await supabase.from(config.table).update(payload).eq("id", currentRowId));
    } else {
      const res = await supabase.from(config.table).insert(payload).select().single();
      error = res.error; currentRowId = res.data?.id;
    }
    if (error) { toast("Save failed: " + error.message, true); return; }
    await logAuditEvent(`updated ${config.table}`, config.table, currentRowId);
    toast("Saved.");
  });
}

// ============================================================================
// INIT
// ============================================================================
checkSessionAndRoute();
</script>
